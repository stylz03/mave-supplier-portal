<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1c140d"/>
      <stop offset="70%" stop-color="#0e0a07"/>
      <stop offset="100%" stop-color="#050302"/>
    </radialGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f5e1b5"/>
      <stop offset="45%" stop-color="#cf8f45"/>
      <stop offset="100%" stop-color="#9a6225"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-opacity="0.35"/>

  <!-- Outer Ring Accent -->
  <circle cx="256" cy="256" r="190" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-opacity="0.25" stroke-dasharray="8 6"/>

  <!-- Stylized M Emblem -->
  <g transform="translate(256, 256) scale(1.15)">
    <!-- Center chevron -->
    <path d="M-80,60 L-80,-40 L0,30 L80,-40 L80,60 L50,60 L50,15 L0,55 L-50,15 L-50,60 Z" fill="url(#goldGrad)" filter="url(#glow)"/>
    <!-- Modern lower arc -->
    <path d="M-95,85 Q0,115 95,85" fill="none" stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>
